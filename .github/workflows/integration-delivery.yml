name: Continuous
on:
  push:
    branches: [ main ] 
    tags: [ "*" ]
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  build: 
    runs-on: ubuntu-latest
    name: Integration
    steps:
    - name: Checkout 
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x' 

    - name: Publish
      working-directory: ${{ github.workspace }}/src/schema/
      run: dotnet publish ./schema.csproj -c Release -o ${{ github.workspace }}/release /p:BlazorEnableCompression=false

    - name: Upload 
      uses: actions/upload-artifact@v7
      with:
        name: wwwroot
        path: ${{ github.workspace }}/release/

  deploy:
    runs-on: ubuntu-latest
    if:  ${{ startsWith(github.ref, 'refs/tags') }}
    needs: [build]
    name: Delivery
    steps:

    - name: Checkout
      uses: actions/checkout@v7

    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        name: wwwroot
        path: ${{ github.workspace }}/release
      
    - name: Setup base path
      run: |
        sed -i 's/<base href="\/" \/>/<base href="\/schema\/" \/>/g' ${{ github.workspace }}/release/wwwroot/index.html
        touch ${{ github.workspace }}/release/wwwroot/.nojekyll
        
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: ${{ github.workspace }}/release/wwwroot 
        branch: gh-pages 
        clean: true 